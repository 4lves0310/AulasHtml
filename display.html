<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black;}
        div{ display:inline-block;

            height: 50px;
            width: 50px;}
        
        span{
        display: block;
        width:50px;
        }
        p{
            display: none; 
        }
        #container{
            width: 100%;
            height: 500px;
            position: relative;
        }

        .box{display:inline-block}
        #box1{
            background-color: greenyellow;
            position: relative;
            top: 50px;
            left: 100px;
        }

        #box2{
            background-color: red;
            position: fixed;
            z-index: -1;
        }
        #box4{
            position: absolute;
            top: 0px;
            left: 0px;
        }
    </style>
</head>
<body>
    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem p</p>
    <p>Lorem p</p>
    <span>Lorem span</span>
    <span>Lorem span</span>
    <hr>
    <h2>Poitions </h2>
    <div id="container">
        <div class="box" id="box">box1</div>
        <div class="box" id="box">box2</div>
        <div class="box" id="box">box3</div>
        <div class="box" id="box">box4</div>
        <div class="box" id="box">box5</div>

    </div>

</body>
</html>
