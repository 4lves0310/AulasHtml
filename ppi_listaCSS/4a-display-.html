<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4a - Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr; 
        }

        #fatia1 {
            background-color: #2563eb; 
        }

        #fatia2 {
            background-color: #16a34a;
        }

        #fatia3 {
            background-color: #dc2626; 
        }

        #fatia4 {
            background-color: #eab308;
        }
    </style>
</head>
<body>

    <div id="fatia1"></div>
    <div id="fatia2"></div>
    <div id="fatia3"></div>
    <div id="fatia4"></div>

</body>
</html>
