<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Layout Responsivo com Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            width: 100vw;
        }

        .box {
            border: 1px solid black;
            flex:1;
            padding: 90px;
        }

        #box1 { background-color: #7e22ce; } /* Roxo */
        #box2 { background-color: #15803d; } /* Verde */
        #box3 { background-color: #b91c1c; } /* Vermelho */
        #box4 { background-color: #facc15; } /* Amarelo */

    </style>
</head>
<body>

    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
    </div>

</body>
</html>
