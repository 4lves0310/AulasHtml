<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6 - Animação Barquinho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 70%, #93c5fd 100%);
            position: relative;
        }

        .nuvem {
            width: 150px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50px;
            position: absolute;
            top: 50px;
            left: -160px;
            box-shadow: 20px 20px 0 0 #ffffff;
            animation: moverNuvem 20s linear infinite;
        }

        .nuvem::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 25px;
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        @keyframes moverNuvem {
            0% { left: -160px; }
            100% { left: 100vw; }
        }

        .barco {
            width: 100px;
            height: 100px;
            background-image: url("https://images.vexels.com/media/users/3/206225/isolated/preview/94dd0d044efc77eb85b73a91be75415a-ilustracao-de-barco-historico-simples.png");
            background-size: contain;
            background-repeat: no-repeat;
            position: absolute;
            bottom: 80px;
            left: -120px;
            z-index: 2; /* Fica à frente da camada base do mar */
            animation: navegar 15s linear infinite, balancar 2s ease-in-out infinite alternate;
        }

        @keyframes navegar {
            0% { left: -120px; }
            100% { left: 100vw; }
        }

        @keyframes balancar {
            0% { transform: rotate(-5deg) translateY(0px); }
            100% { transform: rotate(5deg) translateY(-6px); }
        }

        .mar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background-color: #2563eb;
            z-index: 1;
        }

        .mar::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: radial-gradient(circle at 10px -5px, transparent 12px, #2563eb 13px);
            background-size: 20px 20px;
        }

        .mar::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #1d4ed8;
            opacity: 0.5;
            z-index: 3; 
        }
    </style>
</head>
<body>

    <div class="nuvem"></div>
    <div class="barco"></div>
    <div class="mar"></div>

</body>
</html>
