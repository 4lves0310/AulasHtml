<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="estilo.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atividade 4 - Página de Contato</title>
    </head>
    <body>
        
        <p>
            <a href="4_curriculo.html">← Voltar para o Currículo</a>
        </p>

        <hr>

        <div id="contato-container" class="containerzinho">
            <h1>Página de Contato</h1>
            
            <p>
                <strong>Instruções:</strong> Preencha os campos abaixo para nos enviar sua mensagem. Os campos marcados com asterisco (*) são de preenchimento obrigatório.
            </p>

            <form action="#" method="post">
                <div>
                    <label for="nome">Nome Completo *:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                <br>
                <div>
                    <label for="email">E-mail *:</label><br>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>
                <br>

                <div>
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" placeholder="Qual o motivo do contato?">
                </div>
                <br>

                <div>
                    <label for="estado">Estado:</label><br>
                    <select id="estado" name="estado">
                        <option value="">Selecione seu estado</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="PR">Paraná</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>
                <br>

                <div>
                    <button type="submit">Enviar Mensagem</button>
                </div>
            </form>
        </div>
    </body>
</html>
