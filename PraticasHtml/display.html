<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4a - Display e Positions</title>
    <style>
        * {
            border: 1px solid black;
            box-sizing: border-box;
        }

        /* Regras de Display */
        div {
            display: inline-block;
            height: 50px;
            width: 50px;
        }

        span {
            display: block;
            width: 50px;
        }

        p {
            display: none;
        }

        /* Container Pai */
        #container {
            width: 100%;
            height: 500px;
            position: relative;
        }

        /* Regras de Positions */
        .box {
            display: inline-block;
        }

        /* Canto superior direito */
        #box1 {
            background-color: greenyellow;
            position: absolute;
            top: 0;
            right: 0;
        }

        /* Sobreposto no canto superior direito */
        #box2 {
            background-color: red;
            position: absolute;
            top: 0;
            right: 0;
        }

        /* Canto inferior esquerdo */
        #box3 {
            background-color: white;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        /* Canto inferior direito */
        #box4 {
            background-color: yellowgreen;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        /* Fixado no centro da tela */
        #box5 {
            background-color: red;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* Corrigida a vírgula */
        }
    </style>
</head>
<body>

    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem p</p>
    <p>Lorem p</p>
    <span>Lorem span</span>
    <span>Lorem span</span>

    <hr>

    <h2>Positions</h2>

    <div id="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
    </div>

</body>
</html>
