<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        :root{
            font-size: 10px;

        }
        body {
            height: 100vh;
        }
        p {font-size: 2rem;
            animation: lancamento 45s ease 1;
        }
        @keyframes lancamento{
            0%{
                transform: translateY(0vh) rotate(-45deg);
            }

            100%{
                transform: translateY(100vh) rotate(-45deg);
            }
        }
        
    </style>
</head>
<body>
    <p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwL-1exFybjWuwhb8iIB6fJLPx5VNba48bEmeJHo4WSQ&s=10" alt="Descrição da imagem">
    </p>
</body>
</html>
